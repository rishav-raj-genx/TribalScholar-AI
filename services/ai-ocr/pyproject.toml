[project]
name = "tribalscholar-ai-ocr"
version = "1.0.0"
description = "PaddleOCR and AI document intelligence microservice for TribalScholar AI"
authors = [{ name = "TribalScholar AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "pymupdf>=1.23.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

